# Configuration GitHub Pages (Jekyll) du mini-site public.
title: Ramio
description: Ramio, le rami voleur entre amis — parties en ligne, salons privés, gratuit.
lang: fr
theme: jekyll-theme-cayman
# Page d'accueil (_layouts/accueil.html) : appstore_url renseignée =
# badge App Store (précommande depuis le 23/09) suivi du bouton TestFlight ;
# à la sortie du 8 octobre, ramio_sortie à true retire le bouton TestFlight
# dans les onze langues.
ramio_sortie: false
appstore_url: "https://apps.apple.com/app/id6788317282"
# Vignette des liens partagés (og:image, 1200 x 630) : une vraie partie à
# quatre, cartes en 4 couleurs. Le miroir la réécrit vers quintaingames.com.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/ramio-partie-og.jpg
# On ne publie que les pages du site, pas les documents internes du projet.
exclude:
  - deploiement-serveur.md
  - publication-stores.md
  - fiche-store.md
