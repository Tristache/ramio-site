  a4_p: "الخصوم وعدد أوراقهم على الجانب، والطاولة كاملة في الوسط، ويدك في الأسفل. ما أنزله خصم للتوّ يبقى مظلّلاً: ترى بنظرة واحدة ما الذي تغيّر."
  a4_l:
