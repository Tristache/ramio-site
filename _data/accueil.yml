fr:
  par: "par Quintain Games"
  nav: "Sections"
  jeu: "Le jeu"
  nav_regles: "Règles"
  langue: "Langue"
  h1: "Le rami voleur, en ligne, en famille ou entre amis."
  pitch: "Dans Ramio, on ne pose pas seulement ses cartes : on démonte et on recompose celles des autres pour y glisser les siennes."
  essayer: "Essayer dans le navigateur"
  alt_play: "Disponible sur Google Play"
  alt_appstore: "Télécharger dans l'App Store"
  iphone_beta: "iPhone · bêta TestFlight"
  gratuit_beta: "Gratuit. Sortie le 8 octobre 2026 ; d'ici là, la bêta est ouverte à tous."
  gratuit_sortie: "Gratuit, sur Android et iPhone."
  alt_gif: "Le joker quitte un brelan de valets pour prolonger une suite de cœur, puis le valet de trèfle de la main vient réparer le brelan : la pose est validée."
  legende_gif: "Un joker déplacé, un brelan réparé : la pose passe."
  chiffres: "Ramio en chiffres"
  r_defis: "casse-têtes"
  r_joueurs_n: "2 à 4"
  r_joueurs: "joueurs en ligne"
  r_langues: "langues"
  r_reseau: "réseau requis contre l'ordinateur"
  a1_t: "Jouez avec les vôtres, où qu'ils soient"
  a1_p: "Un salon privé, un code à six caractères à envoyer, et la partie commence. Pas d'amis disponibles ? Les parties publiques accueillent de 2 à 4 joueurs."
  a1_l:
    - "Avec ou sans jokers, partie aux points ou partie simple"
    - "Reconnexion automatique en cas de coupure"
    - "Règles arbitrées par le serveur : impossible de tricher"
  a1_alt: "Un salon privé entre amis, avec son code à partager"
  a2_t: "670 casse-têtes quand personne n'est là"
  a2_p: "Une table déjà posée, quelques cartes en main : trouvez comment tout recomposer. Un défi du jour commun à tous les joueurs, et des duels de rapidité sur le même casse-tête."
  a2_l:
    - "Solo contre l'ordinateur à quatre niveaux, même sans connexion"
    - "Classement du jour et classement Elo"
  a2_alt: "Le défi du jour : une table déjà posée et six cartes en main à placer"
  a3_t: "Une vingtaine d'ambiances, toutes répondent au toucher"
  a3_p: "Tapis, dos de cartes et avatars : certains se débloquent en jouant, d'autres avec des jetons ou dans la boutique. De la forge à la nuit elfique, chaque kit change la table sans toucher aux règles."
  a3_alt: "Les ambiances : tapis, dos de cartes et avatars au choix"
  a4_t: "Une table lisible, même à quatre"
  a4_p: "Les adversaires et leur nombre de cartes sur le côté, la table entière au centre, votre main en bas. Ce qu'un adversaire vient de poser reste surligné : on voit d'un coup d'œil ce qui a bougé."
  a4_l:
    - "Portrait ou paysage, sur téléphone comme sur tablette"
    - "Affichage des cartes en quatre couleurs, au choix"
    - "Amis, messagerie, statistiques et historique"
  a4_alt: "Une partie à quatre en paysage : trois adversaires à gauche, la table au centre, la main en bas ; les cartes que l'adversaire vient de poser sont surlignées."
  e_sur: "Pour commencer"
  e_h2: "Une partie entre amis en trois gestes"
  e1_t: "Créez un salon"
  e1_p: "Choisissez vos règles : jokers ou non, partie aux points ou partie simple."
  e2_t: "Partagez le code"
  e2_p: "Six caractères, par exemple <code>4GDWJ3</code>, à envoyer par message. Le lien ouvre directement le salon."
  e3_t: "Jouez"
  e3_p: "Chacun sur son téléphone, Android ou iPhone, dans sa langue."
  f_h2: "À vous de recomposer la table."
  f_p: "Gratuit, en onze langues. Fait en France."
  reg_sur: "Référence"
  reg_h2: "Les règles du rami voleur"
  reg_intro: "De 2 à 4 joueurs, deux jeux de 52 cartes, avec ou sans jokers. L'essentiel est ici ; le <a href=\"regles-rami-chinois\">guide complet</a> détaille les points et les variantes."
  pays: "France"
  h_conf: "politique-confidentialite"
  h_cond: "conditions-utilisation"
  h_suppr: "suppression-compte"
  p_conf: "Confidentialité"
  p_cond: "Conditions"
  p_suppr: "Supprimer son compte"
  p_mentions: "Mentions légales"
  flottant: "Jouer le casse-tête du jour"

en:
  par: "by Quintain Games"
  nav: "Sections"
  jeu: "The game"
  nav_regles: "Rules"
  langue: "Language"
  h1: "Manipulation Rummy, online with family and friends."
  pitch: "In Ramio you don't just lay down your cards: you take apart and rebuild what the others have played to fit yours in."
  essayer: "Try it in your browser"
  alt_play: "Get it on Google Play"
  alt_appstore: "Download on the App Store"
  iphone_beta: "iPhone · TestFlight beta"
  gratuit_beta: "Free. Launching on 8 October 2026; until then the beta is open to everyone."
  gratuit_sortie: "Free, on Android and iPhone."
  alt_gif: "The joker leaves a set of jacks to extend a run of hearts, then the jack of clubs from the hand repairs the set: the play is confirmed."
  legende_gif: "One joker moved, one set repaired: the play goes through."
  chiffres: "Ramio in numbers"
  r_defis: "puzzles"
  r_joueurs_n: "2 to 4"
  r_joueurs: "players online"
  r_langues: "languages"
  r_reseau: "network needed against the computer"
  a1_t: "Play with your people, wherever they are"
  a1_p: "A private room, a six-character code to send, and the game begins. No friends around? Public games seat 2 to 4 players."
  a1_l:
    - "With or without jokers, points game or single round"
    - "Automatic reconnection if your connection drops"
    - "Rules enforced by the server: cheating is impossible"
  a1_alt: "A private room with friends, with its shareable code"
  a2_t: "670 puzzles for when nobody is around"
  a2_p: "A table already laid out, a few cards in hand: find how to rebuild it all. A daily challenge shared by every player, and speed duels on the same puzzle."
  a2_l:
    - "Solo against the computer at four levels, even offline"
    - "Daily leaderboard and Elo ranking"
  a2_alt: "The daily challenge: a table already laid out and six cards in hand to place"
  a3_t: "Around twenty themes, all of them respond to touch"
  a3_p: "Table felts, card backs and avatars: some unlock as you play, others with tokens or in the shop. From the forge to the elven night, each theme changes the table without touching the rules."
  a3_alt: "Themes: table felts, card backs and avatars to choose from"
  a4_t: "A readable table, even with four players"
  a4_p: "Opponents and their card counts on the side, the whole table in the middle, your hand at the bottom. Whatever an opponent has just played stays highlighted: you see at a glance what moved."
  a4_l:
    - "Portrait or landscape, on phones and tablets"
    - "Optional four-colour deck"
    - "Friends, messaging, statistics and history"
  a4_alt: "A four-player game in landscape: three opponents on the left, the table in the middle, the hand at the bottom; the cards an opponent has just played are highlighted."
  e_sur: "Getting started"
  e_h2: "A game with friends in three steps"
  e1_t: "Create a room"
  e1_p: "Pick your rules: jokers or not, points game or single round."
  e2_t: "Share the code"
  e2_p: "Six characters, for example <code>4GDWJ3</code>, to send in a message. The link opens the room directly."
  e3_t: "Play"
  e3_p: "Everyone on their own phone, Android or iPhone, in their own language."
  f_h2: "Your turn to rebuild the table."
  f_p: "Free, in eleven languages. Made in France."
  reg_sur: "Reference"
  reg_h2: "The rules of Manipulation Rummy"
  reg_intro: "For 2 to 4 players, with two 52-card decks, with or without jokers. The game goes by many names: Räuber-Rommé in Germany, Machiavelli in Italy, Mexe-Mexe in Brazil, rami voleur in France."
  pays: "France"
  h_conf: "privacy-policy"
  h_cond: "terms-of-use"
  h_suppr: "delete-account"
  p_conf: "Privacy"
  p_cond: "Terms"
  p_suppr: "Delete your account"
  p_mentions: "Legal notice"
  flottant: "Play today's puzzle"

