  a1_t: "العب مع أحبائك أينما كانوا"
  a1_p: "غرفة خاصة، ورمز من ستة أحرف ترسله، فتبدأ المباراة. لا أصدقاء متاحين؟ المباريات العامة تتسع لما بين لاعبَين وأربعة."
