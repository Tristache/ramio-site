de:
  par: "von Quintain Games"
  nav: "Abschnitte"
  jeu: "Das Spiel"
  nav_regles: "Regeln"
  langue: "Sprache"
  h1: "Räuber-Rommé, online, mit Familie und Freunden."
  pitch: "In Ramio legst du nicht nur deine Karten ab: Du nimmst die Auslagen der anderen auseinander und baust sie neu, um deine eigenen unterzubringen."
  essayer: "Im Browser ausprobieren"
  alt_play: "Jetzt bei Google Play"
  alt_appstore: "Laden im App Store"
  iphone_beta: "iPhone · TestFlight-Beta"
  gratuit_beta: "Kostenlos. Start am 8. Oktober 2026; bis dahin ist die Beta für alle offen."
  gratuit_sortie: "Kostenlos, für Android und iPhone."
  alt_gif: "Der Joker verlässt einen Buben-Satz und verlängert eine Herz-Reihe, dann repariert der Kreuz-Bube aus der Hand den Satz: Die Auslage ist gültig."
  legende_gif: "Ein Joker verschoben, ein Satz repariert: Der Zug gilt."
  chiffres: "Ramio in Zahlen"
  r_defis: "Rätsel"
  r_joueurs_n: "2 bis 4"
  r_joueurs: "Spieler online"
  r_langues: "Sprachen"
  r_reseau: "Netz nötig gegen den Computer"
  a1_t: "Spiel mit deinen Leuten, wo immer sie sind"
  a1_p: "Ein privater Raum, ein sechsstelliger Code zum Verschicken, und die Partie beginnt. Keine Freunde verfügbar? Öffentliche Partien bieten Platz für 2 bis 4 Spieler."
  a1_l:
    - "Mit oder ohne Joker, Punktepartie oder einfache Partie"
    - "Automatische Wiederverbindung bei Verbindungsabbruch"
    - "Der Server überwacht die Regeln: Schummeln unmöglich"
  a1_alt: "Ein privater Raum unter Freunden, mit seinem Code zum Teilen"
  a2_t: "670 Rätsel, wenn gerade niemand da ist"
  a2_p: "Ein fertig ausgelegter Tisch, ein paar Karten auf der Hand: Finde heraus, wie sich alles neu ordnen lässt. Eine tägliche Herausforderung für alle Spieler und Tempo-Duelle am selben Rätsel."
  a2_l:
    - "Solo gegen den Computer in vier Stufen, auch offline"
    - "Tagesrangliste und Elo-Wertung"
  a2_alt: "Die tägliche Herausforderung: ein fertig ausgelegter Tisch und sechs Handkarten zum Anlegen"
  a3_t: "Rund zwanzig Designs, alle reagieren auf Berührung"
  a3_p: "Spielmatten, Kartenrücken und Avatare: Einige schaltest du beim Spielen frei, andere mit Jetons oder im Shop. Von der Schmiede bis zur Elbennacht verändert jedes Set den Tisch, ohne die Regeln anzutasten."
  a3_alt: "Die Designs: Spielmatten, Kartenrücken und Avatare zur Auswahl"
  a4_t: "Ein übersichtlicher Tisch, auch zu viert"
  a4_p: "Die Gegner und ihre Kartenzahl an der Seite, der ganze Tisch in der Mitte, deine Hand unten. Was ein Gegner gerade ausgelegt hat, bleibt markiert: Du siehst auf einen Blick, was sich bewegt hat."
  a4_l:
    - "Hoch- oder Querformat, auf Handy und Tablet"
    - "Vierfarbiges Blatt, wahlweise"
    - "Freunde, Nachrichten, Statistiken und Verlauf"
  a4_alt: "Eine Partie zu viert im Querformat: drei Gegner links, der Tisch in der Mitte, die Hand unten; die gerade ausgelegten Karten des Gegners sind markiert."
  e_sur: "So geht's los"
  e_h2: "Eine Partie mit Freunden in drei Schritten"
  e1_t: "Raum erstellen"
  e1_p: "Wähle deine Regeln: mit oder ohne Joker, Punktepartie oder einfache Partie."
  e2_t: "Code teilen"
  e2_p: "Sechs Zeichen, zum Beispiel <code>4GDWJ3</code>, per Nachricht verschicken. Der Link öffnet direkt den Raum."
  e3_t: "Spielen"
  e3_p: "Jeder auf seinem Handy, Android oder iPhone, in seiner Sprache."
  f_h2: "Du bist dran: Bau den Tisch um."
  f_p: "Kostenlos, in elf Sprachen. Made in France."
  reg_sur: "Zum Nachschlagen"
  reg_h2: "Die Regeln des Räuber-Rommé"
  reg_intro: "Für 2 bis 4 Spieler, zwei Blätter mit je 52 Karten, mit oder ohne Joker. Das Wesentliche steht hier."
