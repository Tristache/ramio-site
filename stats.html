<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ramio — tableau de bord</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2; --surface: #fcfcfb; --line: #e2e1dc;
    --text: #0b0b0b; --text-2: #52514e; --muted: #8a8985;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #4a3aa7;
    --bad: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --line: #2c2c2a;
      --text: #ffffff; --text-2: #c3c2b7; --muted: #8a8985;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9;
      --bad: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--text-2); font-size: 13px; }
  header .spacer { flex: 1; }
  button, input { font: inherit; }
  button { border: 1px solid var(--line); background: var(--surface); color: var(--text);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--text-2); }
  main { padding: 16px 20px 40px; max-width: 1240px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .tile .k { font-size: 12px; color: var(--text-2); }
  .tile .v { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .tile .s { font-size: 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow: hidden; }
  .card h2 { font-size: 14px; margin: 0 0 2px; }
  .card .sub { font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  svg { display: block; width: 100%; height: auto; }
  .axis { font-size: 10px; fill: var(--muted); }
  .gridline { stroke: var(--line); stroke-width: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--text-2); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  #tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg);
         font-size: 12px; padding: 5px 8px; border-radius: 6px; display: none; z-index: 10; white-space: nowrap; }
  #gate { max-width: 420px; margin: 60px auto; background: var(--surface); border: 1px solid var(--line);
          border-radius: 12px; padding: 20px; }
  #gate input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                background: var(--bg); color: var(--text); margin: 8px 0 10px; }
  #err { color: var(--bad); font-size: 13px; min-height: 1.2em; }
  .funnel .bar { height: 18px; background: var(--s1); border-radius: 0 4px 4px 0; }
  .funnel td:first-child { width: 42%; }
  /* Journal des joueurs (migration 101) */
  .journal { margin-top: 14px; }
  .journal .filtres, .parties .filtres { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .journal .filtres button[aria-pressed="true"], .parties .filtres button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .journal details { border-top: 1px solid var(--line); }
  .journal summary { cursor: pointer; list-style: none; padding: 8px 2px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .journal summary::-webkit-details-marker { display: none; }
  .journal summary::before { content: '\25B8'; color: var(--muted); }
  .journal details[open] > summary::before { content: '\25BE'; }
  .journal .meta { color: var(--text-2); font-size: 12px; }
  .journal .badge, .parties .badge { font-size: 11px; padding: 0 6px; border-radius: 6px; background: var(--line); color: var(--text-2); }
  .journal .corps { padding: 0 2px 8px 14px; }
  .journal .jour { margin: 6px 0 10px; padding-left: 10px; border-left: 2px solid var(--line); }
  .journal .jour h3 { font-size: 13px; margin: 0 0 2px; }
  .journal .resume { font-size: 12px; color: var(--text-2); }
  .journal ul { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; }
  .journal li { padding: 1px 0 1px 3.6em; text-indent: -3.6em; }
  .journal li .h { display: inline-block; min-width: 3.6em; text-indent: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  .journal .ok, .parties .ok { color: var(--s3); }
  .journal .ko, .parties .ko { color: var(--bad); }
  .journal .plus { margin-top: 10px; }
  /* Parties et joueurs (migration 114) */
  .parties { margin-bottom: 18px; }
  .parties > h2 { font-size: 16px; margin: 0 0 2px; }
  .parties > .sub { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
  .parties .large { grid-column: 1 / -1; }
  .parties .large td:nth-child(3) { white-space: normal; }
  #jetons .large td:nth-child(4) { white-space: normal; }
  /* Onglets : un thème à la fois */
  .onglets { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0;
             margin-bottom: 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .onglets button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  @media (min-width: 760px) { .parties .moyen { grid-column: span 2; } }
  .groupe { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); margin: 4px 0 8px; }
  .grid { margin-bottom: 18px; }
  .journal { margin-top: 0; }
</style>
</head>
<body>
<header>
  <h1>Ramio — tableau de bord</h1>
  <span class="meta" id="updated">en attente…</span>
  <span class="spacer"></span>
  <button id="refresh" type="button">Actualiser</button>
  <button id="auto" type="button">Auto : 60 s</button>
  <button id="logout" type="button">Oublier la clé</button>
</header>

<div id="gate" hidden>
  <h2 style="margin:0 0 6px;font-size:16px">Clé d'accès</h2>
  <p style="margin:0;color:var(--text-2);font-size:13px">
    La clé <code>stats</code> de la table <code>admin_secrets</code>. Elle reste dans ce navigateur.
  </p>
  <input id="key" type="password" autocomplete="off" placeholder="clé">
  <button id="enter" type="button">Entrer</button>
  <div id="err"></div>
</div>

<main id="main" hidden>
  <nav class="onglets" id="onglets"></nav>
  <div id="o-essentiel">
    <div id="t-essentiel"></div>
    <div class="parties" id="ess-retention"></div>
    <h3 class="groupe">Trente derniers jours</h3>
    <div class="grid" id="g-essentiel"></div>
  </div>
  <div id="o-acquisition" hidden>
    <div id="t-acquisition"></div>
    <div class="grid" id="g-acquisition"></div>
  </div>
  <div id="o-parties" hidden>
    <section class="parties" id="parties" hidden></section>
    <div id="t-parties"></div>
    <div class="grid" id="g-parties"></div>
  </div>
  <div id="o-retention" hidden>
    <section class="parties" id="retention" hidden></section>
    <div id="t-retention"></div>
    <div class="grid" id="g-retention"></div>
  </div>
  <div id="o-defis" hidden>
    <section class="parties" id="defis" hidden></section>
    <h3 class="groupe">Vue d'ensemble des défis</h3>
    <div class="grid" id="g-defis"></div>
  </div>
  <div id="o-jetons" hidden>
    <section class="parties" id="jetons" hidden></section>
    <h3 class="groupe">Soldes et cosmétiques</h3>
    <div class="grid" id="g-jetons"></div>
  </div>
  <div id="o-usage" hidden>
    <div id="t-usage"></div>
    <div class="grid" id="g-usage"></div>
  </div>
  <div id="o-journal" hidden>
    <section class="card journal" id="journal" hidden></section>
  </div>
</main>
<div id="tip"></div>

<script>
(function () {
  'use strict';
  var API = 'https://zkrkaimrybxbdrznxhxx.supabase.co/rest/v1/rpc/ramio_stats';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprcmthaW1yeWJ4YmRyem54aHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDkzMTYsImV4cCI6MjA5NjY4NTMxNn0.28Ns814SQSFXaKRR0-ZrHoX1G8Cpnhf6sNCZ6kgtAio';
  var TZ = 'Europe/Paris';
  var $ = function (id) { return document.getElementById(id); };
  var key = '';
  try { key = localStorage.getItem('ramio-stats-key') || ''; } catch (e) {}
  var timer = null, auto = true;

  // ---------- accès ----------
  function showGate(msg) {
    $('gate').hidden = false; $('main').hidden = true;
    $('err').textContent = msg || '';
    $('updated').textContent = '';
  }
  $('enter').onclick = function () {
    key = $('key').value.trim();
    if (!key) return;
    try { localStorage.setItem('ramio-stats-key', key); } catch (e) {}
    journal.charge = 0; parties.charge = 0; jetons.charge = 0; retention.charge = 0; defis.charge = 0;
    load();
  };
  $('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('enter').click(); });
  $('logout').onclick = function () {
    key = ''; try { localStorage.removeItem('ramio-stats-key'); } catch (e) {}
    showGate('');
  };
  $('refresh').onclick = function () { journal.charge = 0; parties.charge = 0; jetons.charge = 0; retention.charge = 0; defis.charge = 0; load(); };
  $('auto').onclick = function () {
    auto = !auto; $('auto').textContent = auto ? 'Auto : 60 s' : 'Auto : off';
    schedule();
  };
  function schedule() {
    clearTimeout(timer);
    if (auto && key) timer = setTimeout(load, 60000);
  }

  // ---------- chargement ----------
  function load() {
    if (!key) { showGate(''); return; }
    $('updated').textContent = 'chargement…';
    loadJournal();
    loadParties();
    loadJetons();
    loadRetention();
    loadDefis();
    fetch(API, {
      method: 'POST',
      headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_key: key })
    }).then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error('Clé refusée.');
      if (r.status === 404) throw new Error('Fonction ramio_stats absente : migration 75 à exécuter.');
      if (!r.ok) throw new Error('Erreur ' + r.status);
      return r.json();
    }).then(function (d) {
      // Comptes fondateurs (migration 84) : total public, sans clé.
      return fetch(API.replace('ramio_stats', 'founders_count'), {
        method: 'POST',
        headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
        body: '{}'
      }).then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (n) { if (typeof n === 'number') d.founders = n; return d; });
    }).then(function (d) {
      $('gate').hidden = true; $('main').hidden = false;
      render(d);
      $('updated').textContent = 'mis à jour à ' + fmtTime(d.generated_at) + ' (heure de Paris, jours en UTC)';
      schedule();
    }).catch(function (e) {
      if (/refusée/.test(e.message)) { showGate(e.message); return; }
      $('updated').textContent = e.message;
      schedule();
    });
  }

  // ---------- utilitaires ----------
  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString('fr-FR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function fmtDateTime(iso) {
    return new Date(iso).toLocaleString('fr-FR', { timeZone: TZ, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function fmtDay(d) { return d.slice(8, 10) + '/' + d.slice(5, 7); }
  function isoDay(date) { return date.toISOString().slice(0, 10); }
  function lastDays(n) {
    var out = [], t = new Date(); t.setUTCHours(0, 0, 0, 0);
    for (var i = n - 1; i >= 0; i--) { var d = new Date(t); d.setUTCDate(t.getUTCDate() - i); out.push(isoDay(d)); }
    return out;
  }
  function byDay(rows, keys, n) {
    var idx = {}; rows.forEach(function (r) { idx[r.day] = r; });
    return lastDays(n).map(function (d) {
      var r = idx[d] || {}, o = { day: d };
      keys.forEach(function (k) { o[k] = r[k] || 0; });
      return o;
    });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pct(a, b) { return b ? Math.round(100 * a / b) + ' %' : '—'; }
  function fmtDur(sec) { if (sec == null) return '—'; sec = Math.round(sec); return sec < 90 ? sec + ' s' : Math.round(sec / 60) + ' min'; }
  function kv(obj, labels) {
    return Object.keys(obj || {}).map(function (k) { return [labels && labels[k] || k, obj[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  }

  // ---------- graphique en barres (empilées) ----------
  function bars(rows, series, lab) {
    lab = lab || function (r) { return fmtDay(r.day); };
    var W = 600, H = 170, padL = 28, padB = 18, padT = 8;
    var n = rows.length, gap = 2, bw = (W - padL) / n;
    var max = 0;
    rows.forEach(function (r) { var s = 0; series.forEach(function (x) { s += r[x.key]; }); if (s > max) max = s; });
    max = Math.max(max, 1);
    var step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : max <= 50 ? 10 : Math.ceil(max / 5 / 10) * 10;
    var top = Math.ceil(max / step) * step;
    var y = function (v) { return padT + (H - padT - padB) * (1 - v / top); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
    for (var g = 0; g <= top; g += step) {
      svg += '<line class="gridline" x1="' + padL + '" x2="' + W + '" y1="' + y(g) + '" y2="' + y(g) + '"/>' +
             '<text class="axis" x="' + (padL - 4) + '" y="' + (y(g) + 3) + '" text-anchor="end">' + g + '</text>';
    }
    rows.forEach(function (r, i) {
      var x = padL + i * bw + gap / 2, acc = 0, w = Math.max(bw - gap, 1);
      var label = lab(r) + ' — ' + series.map(function (s) { return s.label + ' ' + r[s.key]; }).join(', ');
      svg += '<g data-tip="' + esc(label) + '">';
      svg += '<rect x="' + x + '" y="' + padT + '" width="' + w + '" height="' + (H - padT - padB) + '" fill="transparent"/>';
      series.forEach(function (s, si) {
        var v = r[s.key]; if (!v) return;
        var y1 = y(acc + v), y0 = y(acc) - (acc ? 2 : 0), h = Math.max(y0 - y1, 1);
        var rx = si === series.length - 1 || !series.slice(si + 1).some(function (t) { return r[t.key]; }) ? 3 : 0;
        svg += '<rect x="' + x + '" y="' + y1 + '" width="' + w + '" height="' + h + '" rx="' + rx + '" fill="' + s.color + '"/>';
        acc += v;
      });
      svg += '</g>';
      if (n <= 14 || i % 5 === 0) {
        svg += '<text class="axis" x="' + (x + w / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + lab(r) + '</text>';
      }
    });
    return svg + '</svg>';
  }
  function legend(series) {
    if (series.length < 2) return '';
    return '<div class="legend">' + series.map(function (s) {
      return '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + '</span>';
    }).join('') + '</div>';
  }
  function chartCard(title, sub, rows, series) {
    var total = 0; rows.forEach(function (r) { series.forEach(function (s) { total += r[s.key]; }); });
    return '<div class="card"><h2>' + esc(title) + '</h2><div class="sub">' + esc(sub) + ' · total 30 j : ' + total + '</div>' +
           legend(series) + bars(rows, series) + '</div>';
  }
  function tableCard(title, sub, head, rows, cls) {
    var html = '<div class="card' + (cls ? ' ' + cls : '') + '"><h2>' + esc(title) + '</h2><div class="sub">' + esc(sub) + '</div>';
    if (!rows.length) return html + '<div class="empty">Rien pour l\'instant.</div></div>';
    html += '<div class="scroll"><table><thead><tr>' + head.map(function (h) {
      return '<th' + (h.n ? ' class="n"' : '') + '>' + esc(h.t) + '</th>';
    }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr>' + r.map(function (c, i) {
        return '<td' + (head[i].n ? ' class="n"' : '') + '>' + (head[i].raw ? c : esc(c)) + '</td>';
      }).join('') + '</tr>';
    });
    return html + '</tbody></table></div></div>';
  }

  // ---------- rendu ----------
  function render(d) {
    var t = d.totals;
    var v2 = t.engaged != null;   // migration 76 passée ?
    var T = {
      appareils: ['Appareils', t.devices, t.devices_android + ' Android · ' + t.devices_ios + ' iPhone'],
      engages: ['Personnes engagées', v2 ? t.engaged : '—', v2 ? pct(t.engaged, t.devices) + ' des appareils · robots exclus' : 'migration 76'],
      // Migration 88 : la tuile affiche les HUMAINS (installs moins les
      // robots des stores) ; le brut et les robots passent en sous-titre.
      installs: t.installs_24h_humains != null
        ? ['Installs 24 h (sans robots)', t.installs_24h_humains,
           t.installs_24h + ' brutes · ' + t.robots_24h + ' robots · ' + t.engaged_24h + ' joueurs']
        : ['Installs 24 h', t.installs_24h, v2 ? t.engaged_24h + ' engagées' : 'premières ouvertures'],
      actifs: ['Actifs aujourd\'hui', t.active_today, t.active_7d + ' sur 7 jours'],
      session: ['Session médiane 7 j', v2 ? fmtDur(t.session_median_s_7d) : '—', v2 ? 'p90 ' + fmtDur(t.session_p90_s_7d) + ' · ' + t.sessions_7d + ' sessions' : 'migration 76'],
      enLigne: ['En ligne', t.online_now, 'profils vus < 5 min'],
      comptes: ['Comptes', t.accounts, t.accounts_anon + ' invités · ' + t.profiles + ' profils'],
      parties: ['Parties en ligne', t.games, t.games_1h + ' dans l\'heure'],
      defis: ['Défis résolus', t.puzzles, 'toutes difficultés'],
      attrition: ['Attrition 14 j', v2 ? t.churned_14d : '—', 'appareils sans session depuis 14 j'],
      push: ['Push activé', v2 ? t.push_users : '—', v2 ? pct(t.push_users, t.accounts) + ' des comptes' : 'migration 76'],
      amities: ['Amitiés', t.friendships, v2 ? t.invites_30d + ' invitations · ' + t.shares_30d + ' partages sur 30 j' : 'liens acceptés'],
      fondateurs: ['Fondateurs', d.founders == null ? '—' : d.founders, d.founders == null ? 'migration 84' : 'sur 1 000 numéros · premium à vie pour les arrivées jusqu’au 15 octobre inclus'],
      parrainage: ['Parrainage', t.referrals_qualified != null ? t.referrals_qualified : '—', t.referrals_total != null ? t.referrals_total + ' filleuls · ' + t.referrals_30d + ' sur 30 j · qualifiés affichés' : 'migration 79'],
      site: ['Visites du site 24 h', t.site_visits_24h, 'pages fr + en']
    };
    // Tuiles de chaque onglet, par groupes titrés.
    $('t-essentiel').innerHTML = tuiles('Maintenant', [T.enLigne, T.actifs, T.installs, T.parties, T.site]) +
                                 tuiles('Depuis le début', [T.appareils, T.engages, T.comptes, T.fondateurs, T.defis]);
    $('t-acquisition').innerHTML = tuiles('Arrivées', [T.installs, T.appareils, T.engages, T.comptes, T.parrainage, T.site]);
    $('t-parties').innerHTML = tuiles('Liens entre joueurs', [T.amities, T.parrainage]);
    $('t-retention').innerHTML = tuiles('Appareils, joueurs ou non', [T.attrition, T.session]);
    $('t-usage').innerHTML = tuiles('Usage', [T.session, T.push, T.enLigne]);

    var S1 = getComputedStyle(document.documentElement).getPropertyValue('--s1').trim();
    var S2 = getComputedStyle(document.documentElement).getPropertyValue('--s2').trim();
    var S3 = getComputedStyle(document.documentElement).getPropertyValue('--s3').trim();
    var plat = [{ key: 'android', label: 'Android', color: S1 }, { key: 'ios', label: 'iPhone', color: S2 }];
    // Cartes de chaque onglet.
    var B = { essentiel: '', acquisition: '', parties: '', retention: '', defis: '', jetons: '', usage: '' };
    B.essentiel += chartCard('Installations par jour', 'premières ouvertures, 30 jours', byDay(d.installs_by_day, ['android', 'ios'], 30), plat);
    B.essentiel += chartCard('Appareils actifs par jour', 'au moins une session', byDay(d.active_by_day, ['android', 'ios'], 30), plat);
    B.essentiel += chartCard('Parties en ligne par jour', 'parties terminées sur le serveur', byDay(d.games_by_day, ['games'], 30), [{ key: 'games', label: 'parties', color: S1 }]);

      headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_key: key })

    if (!b) return;
    if (b.dataset.dt) { defis.tri = b.dataset.dt; defis.limite = 40; }
    else if (b.dataset.dp) defis.limite += 40;
    else return;
    renderDefis();
  });

  // ---------- journal des joueurs (migration 101) ----------
  // Chargé à part (RPC ramio_journal), au plus toutes les 5 minutes :
  // tant que la fonction n'existe pas, un message discret, jamais d'erreur.
  var journal = { data: null, filtre: 'tous', limite: 60, ouverts: {}, index: {}, charge: 0 };
  var MODES = { public: 'publique', prive: 'privée', async: 'en différé', duel: 'duel', solo: 'contre l\'Ordi (en attendant)' };
  var RES = { gagne: 'gagnée', perdu: 'perdue', abandon: 'abandonnée' };
  var ISSUES = { appariee: 'appariée', ordi: 'Ordi', depart: 'départ', coupure: 'coupure' };
  var ECRANS = { defis: 'défis', amis: 'amis', perso: 'personnalisation', progression: 'progression', regles: 'règles',
                 profil: 'profil', classement: 'classement', boutique: 'boutique', prototypes: 'prototypes' };
  var JALONS = { invite_essai: 'Essai invité', compte_cree: 'Compte créé', onboarding_kit: 'Kit d\'accueil choisi',
                 compte_propose: 'Compte proposé', compte_reporte: 'Compte reporté', notif_ouverte: 'Notification ouverte',
                 achat_kit: 'Achat de kit', maj_acceptee: 'Mise à jour acceptée', avis_demande: 'Avis demandé',
                 partage_invite: 'Invitation partagée', partage_jour: 'Défi du jour partagé',
                 parrainage_lien: 'Lien de parrainage partagé', parrainage_gagne: 'Parrainage enregistré' };

  function loadJournal() {
    if (!key || Date.now() - journal.charge < 300000) return;
    journal.charge = Date.now();
    fetch(API.replace('ramio_stats', 'ramio_journal'), {
      method: 'POST',
      headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_key: key, p_days: 7 })
    }).then(function (r) {
      if (r.status === 404) return { absent: true };
      if (!r.ok) throw new Error('erreur ' + r.status);
      return r.json();
    }).then(function (d) { journal.data = d; renderJournal(); })
      .catch(function (e) { journal.data = { erreur: e.message }; journal.charge = 0; renderJournal(); });
  }

  function plur(n, mot) { return n + ' ' + mot + (n > 1 ? 's' : ''); }
  function duree(ms) {
    if (ms == null) return '?';
    var s = Math.round(ms / 1000);
    if (s < 90) return s + ' s';
    var m = Math.round(s / 60);
    return m < 90 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
  }
  function jourLong(d) {
    return new Date(d + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: '2-digit', timeZone: 'UTC' });
  }
  function resultat(r) {
    if (!r) return '';
    return ' · <span class="' + (r === 'gagne' ? 'ok' : r === 'abandon' ? 'ko' : '') + '">' + (RES[r] || esc(r)) + '</span>';
  }
  function itemHtml(i) {
    var t;
    if (i.k === 'partie') {
      t = 'Partie ' + esc(MODES[i.mode] || i.mode || '?') + (i.ms != null ? ' · ' + duree(i.ms) : '') + resultat(i.res) +
          (i.adv && i.mode !== 'solo' ? ' · contre ' + esc(i.adv) : '') + (i.fin ? ' · fin : ' + esc(i.fin) : '');
    } else if (i.k === 'solo') {
      t = 'Solo hors ligne' + (i.nb ? ' contre ' + plur(+i.nb, 'Ordi') : '') + (i.niv ? ' niveau ' + esc(i.niv) : '') +
          resultat(i.res) + (i.pts != null ? ' · ' + i.pts + ' pts' : '') + (i.ms != null ? ' après ' + duree(i.ms) : '');
    } else if (i.k === 'file') {
      t = 'File publique · ' + duree(i.ms) + ' → ' + (ISSUES[i.issue] || 'en cours') +
          (i.offre ? ' · Ordi proposé' + (i.refus ? ', refusé' : '') : '');
    } else {
      t = esc(JALONS[i.e] || i.e) + (i.l ? ' (' + esc(i.l) + ')' : '');
    }
    return '<li><span class="h"' + (i.ap ? ' title="heure d\'envoi, approximative"' : '') + '>' +
           (i.ap ? '~' : '') + esc(i.h) + '</span>' + t + '</li>';
  }
  function resumeJour(j) {
    var p = [], df = j.defis;
    if (j.sessions) p.push(plur(j.sessions, 'session') + (j.duree_ms ? ' (' + duree(j.duree_ms) + ')' : ''));
    if (df) {
      p.push('Défis : ' + (df.reussi || 0) + ' réussis / ' + (df.debut || 0) + ' lancés' +
             (df.abandon ? ', ' + plur(df.abandon, 'abandon') : '') + (df.indices ? ', ' + plur(df.indices, 'indice') : '') +
             (df.temps ? ', ' + df.temps + ' au temps' : ''));
    }
    if (j.defis_ok) p.push('Défis réussis (compte) : ' + j.defis_ok + (j.etoiles ? ', ' + plur(j.etoiles, 'étoile') : ''));
    var jour = j.jour_ms || j.jour_ms_srv;
    if (jour) p.push('Défi du jour réussi en ' + duree(jour));
    else if (j.jour_debut) p.push('Défi du jour tenté');
    if (j.ecrans) p.push('Écrans : ' + j.ecrans.map(function (e) { return esc(ECRANS[e] || e); }).join(', '));
    if (j.calendrier) p.push('Calendrier : case ' + j.calendrier);
    return p.join(' · ');
  }
  function resumeJoueur(p, nbJours) {
    var meta = [p.type === 'appareil' ? 'appareil' : p.invite ? 'invité' : 'compte', p.pays, p.plateforme,
                p.build ? 'build ' + p.build : '', p.appareils ? p.appareils + ' appareils' : '',
                p.installe ? 'installé le ' + fmtDay(p.installe) : '', p.inscrit ? 'inscrit le ' + fmtDay(p.inscrit) : '',
                (p.jours_actifs || 0) + '/' + nbJours + ' j', p.derniere ? 'dernière activité ' + fmtDateTime(p.derniere) : '']
      .filter(Boolean).map(esc).join(' · ');
    return '<b>' + esc(p.nom) + '</b>' + (p.equipe ? '<span class="badge">' + esc(p.equipe) + '</span>' : '') +
           '<span class="meta">' + meta + '</span>';
  }
  function corpsJoueur(p) {
    var html = p.tronque ? '<div class="resume">' + p.tronque + ' éléments plus anciens masqués.</div>' : '';
    (p.jours || []).forEach(function (j) {
      var r = resumeJour(j);
      html += '<div class="jour"><h3>' + esc(jourLong(j.d)) + '</h3>' + (r ? '<div class="resume">' + r + '</div>' : '') +
              (j.items && j.items.length ? '<ul>' + j.items.map(itemHtml).join('') + '</ul>' : '') + '</div>';
    });
    return html || '<div class="empty">Vu dans l\'app, aucune activité enregistrée.</div>';
  }
  function renderJournal() {
    var el = $('journal'), d = journal.data;
    if (!d) return;
    el.hidden = false;
    var html = '<h2>Journal des joueurs (' + (d.jours || 7) + ' jours)</h2>';
    if (d.absent || d.erreur) {
      el.innerHTML = html + '<div class="empty">' + (d.absent ? 'Disponible après la migration 101.' :
        'Indisponible pour l\'instant (' + esc(d.erreur) + ').') + '</div>';
      return;
    }
    var tous = d.joueurs || [], nb = { tous: tous.length, compte: 0, appareil: 0 };
    tous.forEach(function (p) { nb[p.type]++; });
    var liste = journal.filtre === 'tous' ? tous : tous.filter(function (p) { return p.type === journal.filtre; });
    html += '<div class="sub">Par dernière activité, heure de Paris ; parties placées à leur début ; « ~ » = heure d\'envoi (approximative). ' +
            (d.rattachement ? 'Appareils rattachés fondus dans leur compte.' :
             'Rattachement appareil-compte désactivé : un même joueur peut apparaître comme compte ET comme appareil.') + '</div>';
    html += '<div class="filtres">' + [['tous', 'Tous'], ['compte', 'Comptes'], ['appareil', 'Appareils']].map(function (f) {
      return '<button type="button" data-filtre="' + f[0] + '" aria-pressed="' + (journal.filtre === f[0]) + '">' + f[1] + ' (' + nb[f[0]] + ')</button>';
    }).join('') + '</div>';
    journal.index = {};
    liste.slice(0, journal.limite).forEach(function (p) {
      var k = p.type + ':' + p.id, open = !!journal.ouverts[k];
      journal.index[k] = p;
      html += '<details data-k="' + esc(k) + '"' + (open ? ' open' : '') + '><summary>' + resumeJoueur(p, d.jours || 7) +
              '</summary><div class="corps">' + (open ? corpsJoueur(p) : '') + '</div></details>';
    });
    var reste = liste.length - journal.limite;
    if (reste > 0) html += '<button type="button" class="plus" data-plus="1">Afficher ' + Math.min(60, reste) + ' de plus (' + reste + ' restants)</button>';
    el.innerHTML = html;
  }
  $('journal').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button');
    if (!b) return;
    if (b.dataset.filtre) { journal.filtre = b.dataset.filtre; journal.limite = 60; }
    else if (b.dataset.plus) journal.limite += 60;
    else return;
    renderJournal();
  });
  // « toggle » ne remonte pas : écoute en phase de capture. Le détail
  // d'un joueur n'est construit qu'à la première ouverture.
  $('journal').addEventListener('toggle', function (e) {
    var det = e.target, k = det.dataset && det.dataset.k;
    if (!k) return;
    if (det.open) {
      journal.ouverts[k] = true;
      var corps = det.querySelector('.corps');
      if (!corps.innerHTML && journal.index[k]) corps.innerHTML = corpsJoueur(journal.index[k]);
    } else delete journal.ouverts[k];
  }, true);

  // ---------- infobulle ----------
  var tip = $('tip');
  document.addEventListener('mousemove', function (e) {
    var g = e.target.closest && e.target.closest('g[data-tip]');
    if (!g) { tip.style.display = 'none'; return; }
    tip.textContent = g.getAttribute('data-tip');
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
  });

  load();
})();
</script>
</body>
</html>
