<!DOCTYPE html>
<html lang="en">

    <link rel="canonical" href="https://quintaingames.com/ramio/">
    <meta http-equiv="refresh" content="0; url=./?lang=en">
    <script>
      // Ancienne adresse de la page anglaise, devenue l'accueil le 28/11/2026
      // (liens de pagat.com, des stores...) : on y renvoie en gardant
